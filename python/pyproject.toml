[project]
name = "wgnet"
version = "0.2.0"
description = "Wave-to-Gaussian seismic inversion: gather transformer, Gaussian residual scene, exact wgpu adjoint"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "maturin>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wgnet"]
